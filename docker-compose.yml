version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: logistics_db
    environment:
      POSTGRES_USER: logistics_user
      POSTGRES_PASSWORD: logistics_password
      POSTGRES_DB: smart_logistics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: logistics_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://logistics_user:logistics_password@db:5432/smart_logistics
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: logistics_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: